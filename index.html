<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Platformer - Permanent Avatar</title>
    <style>
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            letter-spacing: 2px;
        }

        #controls-hint {
            font-size: 14px;
            color: #888894;
            margin-bottom: 15px;
            text-align: center;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        canvas {
            background: linear-gradient(to bottom, #1e1e24, #111115);
            display: block;
        }

        #overlay-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 20, 0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #overlay-screen h2 {
            color: #00ffcc;
            font-size: 36px;
            margin: 0 0 15px 0;
        }

        button {
            background-color: #00ffcc;
            color: #121214;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:hover {
            background-color: #00d4aa;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>NEON DASH</h1>
    <div id="controls-hint">
        Use <b>Left / Right Arrows (A / D)</b> to move. Press <b>Spacebar (W)</b> to jump.<br>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="overlay-screen">
            <h2 id="overlay-title">LEVEL CLEAR!</h2>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const overlayScreen = document.getElementById("overlay-screen");
        const overlayTitle = document.getElementById("overlay-title");

        // Physics constants
        const GRAVITY = 0.5;
        const FRICTION = 0.85;

        // --- HARDCODE YOUR PLAYER IMAGE HERE ---
        const playerImage = new Image(player);
        playerImage.src = "https://media1.tenor.com/m/e1pU-ElBHPEAAAAC/dancing-crazy.gif"; // <-- CHANGE THIS to your filename or image URL link
        
        // Player object configuration
        const player = {
            x: 50,
            y: 400,
            width: 28, // Sized up slightly to show sprites better
            height: 28,
            vx: 0,
            vy: 0,
            speed: 5,
            jumpForce: 11,
            grounded: false,
            color: "#ff007f" // Fallback color if the image fails to load
        };

        // Static Platforms
        const platforms = [
            { x: 0, y: 480, width: 800, height: 20 },     
            { x: 0, y: 0, width: 20, height: 500 },       
            { x: 780, y: 0, width: 20, height: 500 },     
            { x: 120, y: 380, width: 120, height: 15 },   
            { x: 300, y: 300, width: 150, height: 15 },   
            { x: 150, y: 200, width: 100, height: 15 },   
            { x: 500, y: 220, width: 140, height: 15 },   
            { x: 670, y: 140, width: 110, height: 15 }    
        ];

        // Goal Portal
        const portal = {
            x: 720,
            y: 80,
            width: 30,
            height: 60,
            color: "#00ffcc"
        };

        // Keyboard tracking
        const keys = {};
        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        function resetGame() {
            player.x = 50;
            player.y = 400;
            player.vx = 0;
            player.vy = 0;
            player.grounded = false;
            overlayScreen.style.display = "none";
            requestAnimationFrame(gameLoop);
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            if (keys["ArrowRight"] || keys["KeyD"]) {
                if (player.vx < player.speed) player.vx++;
            }
            if (keys["ArrowLeft"] || keys["KeyA"]) {
                if (player.vx > -player.speed) player.vx--;
            }

            if ((keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && player.grounded) {
                player.vy = -player.jumpForce;
                player.grounded = false;
            }

            player.vx *= FRICTION;
            player.vy += GRAVITY;

            player.x += player.vx;
            platforms.forEach(plat => {
                if (checkCollision(player, plat)) {
                    if (player.vx > 0) player.x = plat.x - player.width;
                    else if (player.vx < 0) player.x = plat.x + plat.width;
                    player.vx = 0;
                }
            });

            player.y += player.vy;
            player.grounded = false;

            platforms.forEach(plat => {
                if (checkCollision(player, plat)) {
                    if (player.vy > 0) { 
                        player.y = plat.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    } else if (player.vy < 0) { 
                        player.y = plat.y + plat.height;
                        player.vy = 0;
                    }
                }
            });

            if (checkCollision(player, portal)) {
                endGame("VICTORY!");
                return false;
            }

            return true;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw platforms
            ctx.fillStyle = "#33333d";
            platforms.forEach(plat => {
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
            });

            // Draw goal portal
            ctx.fillStyle = portal.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = portal.color;
            ctx.fillRect(portal.x, portal.y, portal.width, portal.height);

            // Draw player avatar (Render image if completely loaded, fallback to neon block)
            if (playerImage.complete && playerImage.naturalWidth !== 0) {
                ctx.shadowBlur = 0; 
                ctx.drawImage(playerImage, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = player.color;
                ctx.shadowColor = player.color;
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }
            
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            if (update()) {
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        function endGame(message) {
            overlayTitle.innerText = message;
            overlayScreen.style.display = "flex";
        }

        // Wait for image status updates to render instantly
        playerImage.onload = () => draw();
        
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
